[build]
  publish = "."
  command = ""

[[redirects]]
  from = "https://michelamassage.netlify.app/*"
  to = "https://michelamassage.ch/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.michelamassage.ch/*"
  to = "https://michelamassage.ch/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
